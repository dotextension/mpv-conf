## Mouse
MBTN_LEFT_DBL     cycle fullscreen
MBTN_LEFT         ignore
MBTN_RIGHT        cycle pause

## Media keys 
PLAY             cycle pause
PAUSE            cycle pause
PLAYPAUSE        cycle pause

NEXT             playlist-next
PREV             playlist-prev
MUTE             osd-msg cycle mute
VOLUME_UP        osd-msg add volume 2
VOLUME_DOWN      osd-msg add volume -2

FORWARD          osd-msg seek  10 relative+exact
REWIND           osd-msg seek -5 relative+exact

CLOSE_WIN        quit

## Arrows 
RIGHT            osd-msg seek  10 relative+exact
LEFT             osd-msg seek -5 relative+exact
SHIFT+RIGHT      osd-msg seek  85 relative+exact
SHIFT+LEFT       osd-msg seek -85 relative+exact

UP               osd-msg add speed 0.05
DOWN             osd-msg add speed -0.05
SHIFT+UP         osd-msg add speed 0.5
SHIFT+DOWN       osd-msg add speed -0.5

## Numpad
KP9              playlist-next
KP7              playlist-prev

KP3              osd-msg add chapter 1
KP1              osd-msg add chapter -1

KP6              osd-msg sub-seek 1
KP4              osd-msg sub-seek -1

KP8              osd-msg add volume 2
KP2              osd-msg add volume -2

KP5              cycle fullscreen

KP_INS           cycle pause

KP_ENTER         show-progress
KP_DEL           quit

## TKL Keys
SPACE            cycle pause

s                osd-msg screenshot subtitles
S                osd-msg screenshot video

n                playlist-next
p                playlist-prev
PGDWN            osd-msg add chapter 1
PGUP             osd-msg add chapter -1

m                osd-msg cycle mute

BS               osd-msg set speed 1.0
O                no-osd cycle-values osd-level 3 1

.                frame-step
,                frame-back-step

ENTER            show-progress
ESC              set fullscreen no
f                cycle fullscreen

Ctrl+p           script-binding select/select-playlist
Ctrl+o           script-binding open_file/open
Ctrl+s           script-binding open_file/add_subtitle
Ctrl+a           script-binding open_file/add_audio

i                script-binding stats/display-stats
I                script-binding stats/display-stats-toggle

g                ignore
g-c              script-binding console/enable
g-p              script-binding modernz/progress-toggle
g-m              script-binding select/menu

l                ab-loop

q                quit
Q                quit-watch-later

END              quit-watch-later
HOME             seek 0 absolute

F11              apply-profile Autofit-Small
F12              apply-profile Autofit-Normal
F10              playlist-next
F9               playlist-prev
F8               osd-msg cycle sub
F7               cycle pause
F6               osd-msg seek  10 relative+exact
F5               osd-msg seek -5 relative+exact
F4               osd-msg cycle mute
F3               osd-msg add volume 2
F2               osd-msg add volume -2
F1               osd-msg cycle audio

v                script-binding modernz/visibility

# Image viewer keybinds
WHEEL_UP         {image} script-binding positioning/cursor-centric-zoom  0.1
WHEEL_DOWN       {image} script-binding positioning/cursor-centric-zoom -0.1
0                {image} no-osd set video-align-y 0 ; no-osd set video-align-x 0

# Optimized shaders for higher-end GPU
CTRL+1 osd-msg change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A (HQ)"
