dir=D:\Softwares\mpv\thumb_cache
quit_after_inactivity=30
tone_mapping=no

# Maximum thumbnail size (matches ModernZ's high-res scaling)
max_height=360
max_width=360

# Allow hardware decoding for the thumbnail generation (makes it much faster)
hwdec=yes

# Allow thumbnails for network streams / YouTube videos
network=yes

# Spawn the background worker without waiting
spawn_first=yes

# The exact path to the executable file
mpv_path=D:\Softwares\mpv\mpv.exe